name: JFStack WordPress · Validar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar configuración ficticia
        run: |
          cp .env.example .env
          printf '%s' 'ci-placeholder' > secrets/db_password.txt
          printf '%s' 'ci-placeholder' > secrets/db_root_password.txt

      - name: Validar Compose con red externa
        run: docker compose config --quiet

      - name: Validar Compose con red propia
        run: PROXY_NETWORK=jfstack-ci-egress PROXY_NETWORK_EXTERNAL=false docker compose config --quiet

      - name: Comprobar PHP de la imagen y su configuración
        run: |
          docker compose pull wordpress
          docker run --rm --network none -v "$PWD/scripts/wordpress-entrypoint.sh:/check.sh:ro" --entrypoint /check.sh wordpress:7.1-php8.3-apache --check-php
          docker run --rm --network none -v "$PWD/config/php/uploads.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro" --entrypoint php wordpress:7.1-php8.3-apache -r 'exit(ini_get("session.upload_progress.enabled") ? 1 : 0);'

      - name: Validar sintaxis Shell
        run: |
          bash -n deploy.sh scripts/*.sh
          sh -n scripts/wordpress-entrypoint.sh

      - name: Instalar ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Analizar scripts Shell
        run: shellcheck deploy.sh scripts/*.sh

      - name: Impedir datos sensibles versionados
        shell: bash
        run: |
          if git ls-files \
            | grep -Ev '(^|/)\.env\.example$|(^|/)secrets/(README\.md|\.gitkeep|.*\.example)$|(^|/)backups/\.gitkeep$' \
            | grep -E '(^|/)(\.env($|\.)|secrets/|.*\.(key|pem|p12|pfx|sql|dump|enc)$|backups/|exports/)'; then
            echo 'Se detectaron rutas sensibles versionadas.' >&2
            exit 1
          fi
